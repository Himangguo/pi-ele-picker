name: Release

# Publishes to npm via Trusted Publishing (OIDC) — no long-lived npm token is
# used or stored. The registry verifies this exact workflow file against the
# package's Trusted Publisher configuration on npmjs.com.
#
#   npmjs.com → Packages → pi-ele-picker → Settings → Trusted publishing
#     Organization or user: Himangguo
#     Repository:           pi-ele-picker
#     Workflow filename:    release.yml   (filename only, must match this file)
#     Allowed actions:      npm publish  ← must be enabled, or publish is refused
#
# Tagging is what releases: `npm version <x.y.z>` then `git push --follow-tags`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # re-run a release (e.g. for a tag pushed before this file existed)

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange with the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      # Node 24 ships npm 11, but Trusted Publishing needs >= 11.5.1 — pin the
      # floor explicitly so the runner image can never silently fall below it.
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@^11.15.0 && npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # package.json's `prepublishOnly` rebuilds; the steps above fail fast with
      # clearer attribution. OIDC is auto-detected — no NODE_AUTH_TOKEN here.
      - name: Check whether this version is already on the registry
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pi-ele-picker@$version" version >/dev/null 2>&1; then
            echo "pi-ele-picker@$version is already published — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # OIDC failures are silent by design: npm logs the exchange error at verbose
      # level and then falls back to an anonymous request, which the registry
      # answers with a bare `404 PUT` that says nothing about the cause. Keep the
      # log level up here, or a broken Trusted Publisher config is undiagnosable.
      - name: Verify the GitHub id-token endpoint is reachable
        if: steps.check.outputs.publish == 'true'
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::No GitHub id-token in the environment. Check 'permissions: id-token: write'."
            exit 1
          fi
          echo "id-token endpoint is available — 'permissions: id-token: write' is in effect."
          # Print the claims the registry matches the Trusted Publisher config
          # against, so an "OIDC token exchange error - package not found" can be
          # compared field by field instead of guessed at. Claims only — the token
          # itself is never echoed.
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
          | node -e '
              let raw = ""
              process.stdin.on("data", (c) => (raw += c)).on("end", () => {
                const { value } = JSON.parse(raw)
                const p = JSON.parse(Buffer.from(value.split(".")[1], "base64url").toString())
                console.log("OIDC claims the registry sees:")
                console.log(JSON.stringify({
                  repository: p.repository,
                  repository_owner: p.repository_owner,
                  workflow_ref: p.workflow_ref,
                  environment: p.environment || null,
                  ref: p.ref,
                  event_name: p.event_name,
                }, null, 2))
              })
            '

      - if: steps.check.outputs.publish == 'true'
        run: npm publish --loglevel verbose